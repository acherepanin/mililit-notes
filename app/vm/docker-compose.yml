name: ${COMPOSE_PROJECT_NAME:-notes}

services:
  notes:
    image: ${APP_IMAGE:-notes-app:latest}
    build:
      context: ..
      dockerfile: back/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/notes.sqlite
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-whisper-1}
    volumes:
      - type: bind
        source: ${NOTES_DATA_DIR:-./data}
        target: /app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
