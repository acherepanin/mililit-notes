name: notes-dev

services:
  # Локальная БД, проброшена на localhost:5432
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adm136479
      POSTGRES_DB: notes
    ports:
      - "5432:5432"
    volumes:
      - notes-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # Сборка из исходников, БД по имени сервиса postgres
  notes:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: dev
      NODE_ENV: development
      DB_HOST: postgres
    ports:
      - "3000:3000"
    volumes:
      - notes-dev-uploads:/app/data

volumes:
  notes-dev-db:
  notes-dev-uploads:
