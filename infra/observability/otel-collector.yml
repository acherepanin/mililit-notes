receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  attributes/sanitize:
    actions:
      - key: url.full
        action: delete
      - key: url.query
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.x-notes-signature
        action: delete
      - key: http.request.header.x-notes-timestamp
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - key: http.request.body
        action: delete
      - key: http.response.body
        action: delete
      - key: user_agent.original
        action: delete
      - key: client.address
        action: delete
      - key: network.peer.address
        action: delete
      - key: network.peer.port
        action: delete
  batch:
    timeout: 1s

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/sanitize, batch]
      exporters: [otlp_grpc/tempo]
