global:
  evaluation_interval: 15s
  scrape_interval: 15s
  scrape_timeout: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: notes-api
    metrics_path: /api/metrics
    static_configs:
      - targets: [api:3001]

  - job_name: notes-worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker:3002]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
